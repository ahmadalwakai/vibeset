workflows:
  ios-native-unsigned:
    name: Vibeset native iPhone compile (unsigned)
    working_directory: mobile
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 24
      xcode: '27.1'
      cocoapods: default
      groups:
        - vibeset_native
      vars:
        VIBESET_NATIVE_GENERATE: '1'
        CI: '1'
        EXPO_NO_TELEMETRY: '1'
    cache:
      cache_paths:
        - $HOME/.npm
    scripts:
      - name: Install shared contract dependencies
        script: npm ci --prefix .. --include=dev --include=optional
      - name: Install native app dependencies
        script: npm ci --include=dev --include=optional
      - name: Check native identifiers and public origins
        script: npm run check:native
      - name: Check native dependency compatibility
        script: npm run check:expo
      - name: Native TypeScript and lint
        script: npm run typecheck && npm run lint
      - name: Native contract tests
        script: npm test
      - name: Generate iOS application and widget extension
        script: npm run prebuild:ios
      - name: Install iOS pods
        script: |
          set -euo pipefail
          cd ios
          pod install
      - name: Compile iPhone application and widgets without signing
        script: |
          set -euo pipefail
          test -d ios/Vibeset.xcworkspace
          xcodebuild -workspace ios/Vibeset.xcworkspace -scheme Vibeset \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath build/unsigned CODE_SIGNING_ALLOWED=NO build
          test -d build/unsigned/Build/Products/Debug-iphoneos/Vibeset.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/unsigned/Build/Products/Debug-iphoneos/Vibeset.app \
            build/vibeset-unsigned-ios-app.zip
    artifacts:
      - mobile/build/vibeset-unsigned-ios-app.zip
  web-production:
    name: Vibeset web production build
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 24
      vars:
        NEXT_PUBLIC_SITE_URL: https://vibeset.app
        NEXT_PUBLIC_CDN_URL: https://cdn.vibeset.app
        NEXT_TELEMETRY_DISABLED: '1'
        E2E_TEST_AUTH: '0'
    cache:
      cache_paths:
        - $HOME/.npm
    scripts:
      - name: Install dependencies
        script: npm ci --include=dev --include=optional
      - name: Generate Chakra token declarations
        script: npm run chakra:typegen
      - name: Typecheck
        script: npm run typecheck
      - name: Lint
        script: npm run lint
      - name: Unit tests
        script: |
          set -euo pipefail
          mkdir -p build
          npm test -- --reporter=default --reporter=junit --outputFile=build/test-results.xml
        test_report: build/test-results.xml
      - name: Build Next.js
        script: npm run build
      - name: Package standalone server
        script: |
          set -euo pipefail
          test -f .next/standalone/server.js
          mkdir -p .next/standalone/.next build
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then
            cp -R public .next/standalone/public
          fi
          npx tsx scripts/check-standalone.ts
          artifact="build/vibeset-web-$(node -p process.platform)-$(node -p process.arch).tar.gz"
          tar --exclude='.env*' --exclude='**/.env*' -czf "$artifact" -C .next/standalone .
    artifacts:
      - build/*.tar.gz
      - build/test-results.xml
