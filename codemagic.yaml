workflows:
  ios-native-unsigned:
    name: Vibeset native iPhone compile (unsigned)
    working_directory: mobile
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 24
      xcode: '27.1'
      cocoapods: default
      groups:
        - vibeset_native
      vars:
        VIBESET_NATIVE_GENERATE: '1'
        CI: '1'
        EXPO_NO_TELEMETRY: '1'
    cache:
      cache_paths:
        - $HOME/.npm
    scripts:
      - name: Install shared contract dependencies
        script: npm ci --prefix .. --include=dev --include=optional
      - name: Install native app dependencies
        script: npm ci --include=dev --include=optional
      - name: Check native identifiers and public origins
        script: npm run check:native
      - name: Check native dependency compatibility
        script: npm run check:expo
      - name: Native TypeScript and lint
        script: npm run typecheck && npm run lint
      - name: Native contract tests
        script: npm test
      - name: Generate iOS application and widget extension
        script: npm run prebuild:ios
      - name: Install iOS pods
        script: |
          set -euo pipefail
          cd ios
          pod install
      - name: Compile iPhone application and widgets without signing
        script: |
          set -euo pipefail
          test -d ios/Vibeset.xcworkspace
          mkdir -p build
          xcodebuild -workspace ios/Vibeset.xcworkspace -scheme Vibeset \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath build/unsigned CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee build/unsigned-xcodebuild.log
          test -d build/unsigned/Build/Products/Debug-iphoneos/Vibeset.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/unsigned/Build/Products/Debug-iphoneos/Vibeset.app \
            build/vibeset-unsigned-ios-app.zip
    artifacts:
      - $CM_BUILD_DIR/mobile/build/vibeset-unsigned-ios-app.zip
      - $CM_BUILD_DIR/mobile/build/unsigned-xcodebuild.log
  ios-native-simulator:
    name: Vibeset native iPhone simulator diagnostics
    working_directory: mobile
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 24
      xcode: '27.1'
      cocoapods: default
      vars:
        VIBESET_NATIVE_GENERATE: compile
        VIBESET_IOS_BUNDLE_ID: com.ahmadalwakai.vibeset
        VIBESET_IOS_WIDGET_BUNDLE_ID: com.ahmadalwakai.vibeset.calendar
        VIBESET_IOS_APP_GROUP: group.com.ahmadalwakai.vibeset
        CI: '1'
        EXPO_NO_TELEMETRY: '1'
    cache:
      cache_paths:
        - $HOME/.npm
    scripts:
      - name: Install shared contract dependencies
        script: npm ci --prefix .. --include=dev --include=optional
      - name: Install native app dependencies
        script: npm ci --include=dev --include=optional
      - name: Check explicit compile-only native configuration
        script: npm run check:native:compile
      - name: Check native dependency compatibility
        script: npm run check:expo
      - name: Native TypeScript and lint
        script: npm run typecheck && npm run lint
      - name: Native contract tests
        script: npm test
      - name: Generate compile-only iOS application and widget extension
        script: npm run prebuild:ios:compile
      - name: Install iOS pods
        script: |
          set -euo pipefail
          cd ios
          pod install
      - name: Compile self-contained simulator application and widgets
        script: |
          set -euo pipefail
          test -d ios/Vibeset.xcworkspace
          mkdir -p build
          xcodebuild -workspace ios/Vibeset.xcworkspace -scheme Vibeset \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee build/simulator-xcodebuild.log
          test -s build/simulator/Build/Products/Release-iphonesimulator/Vibeset.app/main.jsbundle
          test -d build/simulator/Build/Products/Release-iphonesimulator/Vibeset.app/PlugIns/ExpoWidgetsTarget.appex
          ditto -c -k --sequesterRsrc --keepParent \
            build/simulator/Build/Products/Release-iphonesimulator/Vibeset.app \
            build/vibeset-simulator-ios-app.zip
      - name: Capture actual simulator launch diagnostics
        script: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { setTimeout as delay } from 'node:timers/promises';

          const output = 'build/simulator-diagnostics';
          const app = 'build/simulator/Build/Products/Release-iphonesimulator/Vibeset.app';
          const bundleId = process.env.VIBESET_IOS_BUNDLE_ID;
          if (!bundleId) throw new Error('The validated native app identifier is required.');
          const simctl = (args, timeout = 60_000) =>
            execFileSync('xcrun', ['simctl', ...args], { encoding: 'utf8', timeout });
          const inventory = JSON.parse(simctl(['list', '--json']));
          const runtime = inventory.runtimes.find(
            (item) => item.identifier === 'com.apple.CoreSimulator.SimRuntime.iOS-27-0' && item.isAvailable,
          );
          const device = inventory.devicetypes.find(
            (item) => item.identifier === 'com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro',
          );
          if (!runtime || !device) throw new Error('The pinned iPhone 17 Pro / iOS 27.0 simulator is unavailable.');
          mkdirSync(output, { recursive: true });
          const udid = simctl(['create', 'Vibeset diagnostic iPhone', device.identifier, runtime.identifier]).trim();
          try {
            simctl(['boot', udid]);
            // First iOS 27 boot performs DataMigration; allow a bounded ten-minute cold boot.
            simctl(['bootstatus', udid, '-b'], 600_000);
            simctl(['ui', udid, 'appearance', 'light']);
            simctl(['status_bar', udid, 'override', '--time', '9:41', '--batteryState', 'charged', '--batteryLevel', '100']);
            simctl(['install', udid, app]);
            const launch = simctl(['launch', udid, bundleId, '-AppleLanguages', '(en)', '-AppleLocale', 'en_GB']);
            simctl(['io', udid, 'screenshot', `${output}/launch.png`]);
            // A bounded diagnostic sample after the API's 20-second timeout; this is not a UI-ready assertion.
            await delay(25_000);
            simctl(['io', udid, 'screenshot', `${output}/launch-after-25s.png`]);
            writeFileSync(`${output}/capture.json`, JSON.stringify({
              purpose: 'diagnostic-only',
              device: device.name,
              runtime: runtime.version,
              appearance: 'light',
              launchAccepted: /^.+: \d+\s*$/.test(launch),
              apiReachabilityVerified: false,
              uiReadinessVerified: false,
              widgetPlacementVerified: false,
              testFlightUpload: false,
            }, null, 2));
          } finally {
            try { simctl(['shutdown', udid]); } finally { simctl(['delete', udid]); }
          }
          NODE
    artifacts:
      - $CM_BUILD_DIR/mobile/build/vibeset-simulator-ios-app.zip
      - $CM_BUILD_DIR/mobile/build/simulator-xcodebuild.log
      - $CM_BUILD_DIR/mobile/build/simulator-diagnostics/**
  ios-native-testflight:
    name: Vibeset native iPhone TestFlight (internal only)
    working_directory: mobile
    instance_type: mac_mini_m2
    max_build_duration: 90
    # Manual only: no webhook/schedule trigger or public App Store submission.
    integrations:
      app_store_connect: Vibeset Codemagic
    environment:
      node: 24
      xcode: '27.1'
      cocoapods: default
      groups:
        - vibeset_native
      # Fetch existing saved signing identities; never create/revoke certificates here.
      # Codemagic also matches the separately registered .calendar extension.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ahmadalwakai.vibeset
      vars:
        VIBESET_NATIVE_GENERATE: '1'
        VIBESET_IOS_BUNDLE_ID: com.ahmadalwakai.vibeset
        VIBESET_IOS_WIDGET_BUNDLE_ID: com.ahmadalwakai.vibeset.calendar
        VIBESET_IOS_APP_GROUP: group.com.ahmadalwakai.vibeset
        VIBESET_IOS_TEAM_ID: BXK52CMHR2
        APP_STORE_APPLE_ID: '6826572844'
        CI: '1'
        EXPO_NO_TELEMETRY: '1'
    cache:
      cache_paths:
        - $HOME/.npm
    scripts:
      - name: Install shared contract dependencies
        script: |
          #!/bin/bash
          set -euo pipefail
          # Remove integration secrets before dependency lifecycle scripts can run.
          for native_secret_name in ${!APP_STORE_CONNECT_@} CERTIFICATE_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY_PASSWORD CERTIFICATE_PASSWORD CM_CERTIFICATE CM_CERTIFICATE_PASSWORD CM_PROVISIONING_PROFILE APP_SPECIFIC_PASSWORD; do
            unset "$native_secret_name"
          done
          npm ci --prefix .. --include=dev --include=optional
      - name: Install native app dependencies
        script: |
          #!/bin/bash
          set -euo pipefail
          for native_secret_name in ${!APP_STORE_CONNECT_@} CERTIFICATE_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY_PASSWORD CERTIFICATE_PASSWORD CM_CERTIFICATE CM_CERTIFICATE_PASSWORD CM_PROVISIONING_PROFILE APP_SPECIFIC_PASSWORD; do
            unset "$native_secret_name"
          done
          npm ci --include=dev --include=optional
      - name: Verify real published catalogue and CDN before building
        script: node --import tsx scripts/check-ios-release.ts preflight
      - name: Check native dependency compatibility
        script: node --import tsx scripts/check-ios-release.ts run-build npm run check:expo
      - name: Native TypeScript and lint
        script: |
          set -euo pipefail
          node --import tsx scripts/check-ios-release.ts run-build npm run typecheck
          node --import tsx scripts/check-ios-release.ts run-build npm run lint
      - name: Native contract tests
        script: node --import tsx scripts/check-ios-release.ts run-build npm test
      - name: Generate release application and calendar extension
        script: node --import tsx scripts/check-ios-release.ts run-build npm run prebuild:ios
      - name: Install iOS pods
        script: |
          set -euo pipefail
          cd ios
          node --import tsx ../scripts/check-ios-release.ts run-build pod install
      - name: Apply both App Store profiles for internal TestFlight export
        script: |
          set -euo pipefail
          mkdir -p build/ios-release
          node --import tsx scripts/check-ios-release.ts run-build xcode-project use-profiles --project ios/Vibeset.xcodeproj \
            --archive-method app-store \
            --export-options-plist build/ios-release/export-options.plist \
            --custom-export-options='{"testFlightInternalTestingOnly":true,"teamID":"BXK52CMHR2","signingStyle":"manual","manageAppVersionAndBuildNumber":false}'
          node --import tsx scripts/check-ios-release.ts export-options
      - name: Set a unique increasing build number from the project-wide CI counter
        script: |
          set -euo pipefail
          # A failed ASC query aborts; only a successful empty lookup means no prior build.
          app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" \
            --platform IOS --all-versions > build/ios-release/latest-build-number.txt
          native_build_number=$(node --import tsx scripts/check-ios-release.ts number)
          native_version=$(node -p "require('./package.json').version")
          echo "VIBESET_NATIVE_BUILD_NUMBER=$native_build_number" >> "$CM_ENV"
          cd ios
          node --import tsx ../scripts/check-ios-release.ts run-build agvtool new-marketing-version "$native_version"
          node --import tsx ../scripts/check-ios-release.ts run-build agvtool new-version -all "$native_build_number"
      - name: Archive and export a signed Release IPA with bundled JavaScript
        script: |
          set -euo pipefail
          test -d ios/Vibeset.xcworkspace
          node --import tsx scripts/check-ios-release.ts run-build xcode-project build-ipa --workspace ios/Vibeset.xcworkspace \
            --scheme Vibeset --config Release --no-show-build-settings \
            --archive-directory build/ios/xcarchive --ipa-directory build/ios/ipa \
            --export-options-plist build/ios-release/export-options.plist \
            2>&1 | tee build/release-xcodebuild.log
      - name: Verify signatures and increasing version before releasing the IPA to publishing
        script: |
          set -euo pipefail
          app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" \
            --platform IOS --all-versions > build/ios-release/latest-build-number.txt
          # Raw exports remain quarantined if any check fails, even if publishing still runs.
          node --import tsx scripts/check-ios-release.ts publishable
    artifacts:
      - $CM_BUILD_DIR/mobile/build/ios/verified/*.ipa
      - $CM_BUILD_DIR/mobile/build/ios/xcarchive/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        # Upload plus explicit assignment to the verified internal group; no beta review.
        submit_to_testflight: false
        beta_groups:
          - Vibeset Internal
        submit_to_app_store: false
  web-production:
    name: Vibeset web production build
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: 24
      vars:
        NEXT_PUBLIC_SITE_URL: https://vibeset.app
        NEXT_PUBLIC_CDN_URL: https://cdn.vibeset.app
        NEXT_TELEMETRY_DISABLED: '1'
        E2E_TEST_AUTH: '0'
    cache:
      cache_paths:
        - $HOME/.npm
    scripts:
      - name: Install dependencies
        script: npm ci --include=dev --include=optional
      - name: Generate Chakra token declarations
        script: npm run chakra:typegen
      - name: Typecheck
        script: npm run typecheck
      - name: Lint
        script: npm run lint
      - name: Unit tests
        script: |
          set -euo pipefail
          mkdir -p build
          npm test -- --reporter=default --reporter=junit --outputFile=build/test-results.xml
        test_report: build/test-results.xml
      - name: Build Next.js
        script: npm run build
      - name: Package standalone server
        script: |
          set -euo pipefail
          test -f .next/standalone/server.js
          mkdir -p .next/standalone/.next build
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then
            cp -R public .next/standalone/public
          fi
          npx tsx scripts/check-standalone.ts
          artifact="build/vibeset-web-$(node -p process.platform)-$(node -p process.arch).tar.gz"
          tar --exclude='.env*' --exclude='**/.env*' -czf "$artifact" -C .next/standalone .
    artifacts:
      - build/*.tar.gz
      - build/test-results.xml
