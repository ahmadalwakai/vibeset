name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SITE_URL: https://vibeset.app
  NEXT_PUBLIC_CDN_URL: https://cdn.vibeset.app
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Types, lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev --include=optional
      - run: npm run chakra:typegen
      - run: npm run typecheck
        env:
          SKIP_ENV_VALIDATION: '1'
      - run: npm run lint
      - run: npx vitest run tests/unit
      - run: npm run build
      - run: npx tsx scripts/check-standalone.ts

  coverage:
    name: Isolated database coverage (80/70/90)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    # Configure required reviewers before enabling secret-bearing PR runs.
    environment: ci-database
    steps:
      - name: Require trusted code and isolated Neon configuration
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_CI_PARENT_BRANCH_ID: ${{ vars.NEON_CI_PARENT_BRANCH_ID }}
        run: |
          set -euo pipefail
          if [ "$IS_FORK" = true ]; then
            echo '::error::Full database coverage requires a reviewed same-repository commit. Unit checks alone do not satisfy the 70% service gate.'
            exit 1
          fi
          for name in NEON_API_KEY NEON_PROJECT_ID NEON_CI_PARENT_BRANCH_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name in the protected ci-database environment. The full coverage gate cannot run without an isolated branch."
              exit 1
            fi
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --include=dev --include=optional
      - name: Branch expiry fallback
        id: expiry
        run: echo "at=$(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Create empty isolated Neon branch
        id: branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          parent_branch: ${{ vars.NEON_CI_PARENT_BRANCH_ID }}
          branch_name: ci-${{ github.run_id }}-${{ github.run_attempt }}
          branch_type: schema-only
          database: ${{ vars.NEON_DATABASE_NAME || 'neondb' }}
          role: ${{ vars.NEON_DATABASE_ROLE || 'neondb_owner' }}
          expires_at: ${{ steps.expiry.outputs.at }}
      - name: Verify empty target and apply migrations
        run: npx tsx scripts/ci/prepare-test-database.ts
        env:
          TEST_DATABASE_URL: ${{ steps.branch.outputs.db_url }}
      - name: Run unit and live integration coverage
        run: npm test -- --coverage --maxWorkers=2
        env:
          TEST_DATABASE_URL: ${{ steps.branch.outputs.db_url }}
          NODE_ENV: test
      - name: Delete this run's isolated branch
        if: always() && steps.branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          api_key: ${{ secrets.NEON_API_KEY }}
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.branch.outputs.branch_id }}
